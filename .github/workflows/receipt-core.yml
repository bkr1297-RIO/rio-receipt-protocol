name: Receipt core

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Initialize isolated local unit
        run: npm run init -- --owner "human:ci"
      - name: Run declared test suite
        run: npm test
      - name: Generate and verify a receipt
        run: |
          node generate_receipt.js
          node verify_receipt.js examples/valid_receipt.json
